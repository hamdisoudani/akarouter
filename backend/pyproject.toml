[project]
name = "akarouter"
version = "0.1.0"
description = "AKAROUTER multi-account AI proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "supabase>=2.3.5",
    "daytona>=0.186.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Scope to the tests/ directory. The scratch/ folder contains one-off
# scripts (some with names starting with `test_`) that exit the
# interpreter with sys.exit and are not pytest tests. Without this,
# pytest auto-collects them and fails the whole run.
testpaths = ["tests"]
python_files = ["test_*.py"]
# Add the project root to sys.path so `from app.X import Y` works in
# tests, regardless of where pytest is invoked from (CI runs from
# `backend/` so this matters).
pythonpath = ["."]
