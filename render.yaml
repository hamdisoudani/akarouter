services:
  - type: web
    name: akarouter-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: AKAROUTER_PORT
        value: 10000
      - key: AKAROUTER_SUPABASE_URL
        sync: false
      - key: AKAROUTER_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AKAROUTER_SUPABASE_DB_URL
        sync: false
